name: Extract GeoGuesser project
on:
  push:
    branches: [main]
    paths:
      - "build-polished-geoguesser-game.zip"
      - ".github/workflows/extract-game.yml"
permissions:
  contents: write
jobs:
  extract-and-build:
    if: ${{ !contains(github.event.head_commit.message, '[skip-extract]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Extract archive safely
        run: |
          python3 - <<'PY'
          import zipfile
          from pathlib import PurePosixPath
          archive = "build-polished-geoguesser-game.zip"
          with zipfile.ZipFile(archive) as z:
              for item in z.infolist():
                  path = PurePosixPath(item.filename)
                  if path.is_absolute() or ".." in path.parts:
                      raise SystemExit(f"Unsafe archive path: {item.filename}")
                  if item.is_dir():
                      continue
                  target = path.as_posix()
                  if target == archive:
                      continue
                  import os
                  os.makedirs(os.path.dirname(target) or ".", exist_ok=True)
                  with z.open(item) as src, open(target, "wb") as dst:
                      dst.write(src.read())
          PY
          rm -f build-polished-geoguesser-game.zip
          cat > .gitignore <<'EOF'
          node_modules/
          dist/
          .DS_Store
          EOF
      - name: Install dependencies and build
        id: build
        continue-on-error: true
        run: |
          npm ci
          npm run build
      - name: Commit extracted source and build result
        env:
          BUILD_OUTCOME: ${{ steps.build.outcome }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if [ "$BUILD_OUTCOME" = "success" ]; then
            git commit -m "Extract GeoGuesser game and verify production build [skip-extract]"
          else
            git commit -m "Extract GeoGuesser game; build needs fixing [skip-extract]"
          fi
          git push
